name: Arkira CI Cache Warm

on:
  push:
    branches: [main]
    paths:
      - .arkira/ci.json
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - pnpm-lock.yaml
      - yarn.lock
permissions:
  contents: read

concurrency:
  group: arkira-cache-warm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    uses: jeanchastel/arkira/.github/workflows/cache-warm.yml@stable # approved-channel: stable
