name: Arkira CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: arkira-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  central-validate:
    uses: jeanchastel/arkira/.github/workflows/validate.yml@stable # approved-channel
    with:
      product_variable_1: ${{ vars.ARKIRA_PRODUCT_VARIABLE_1 }}
      product_variable_2: ${{ vars.ARKIRA_PRODUCT_VARIABLE_2 }}
      product_variable_3: ${{ vars.ARKIRA_PRODUCT_VARIABLE_3 }}
      product_variable_4: ${{ vars.ARKIRA_PRODUCT_VARIABLE_4 }}
    secrets:
      product_secret_1: ${{ secrets.ARKIRA_PRODUCT_SECRET_1 }}
      product_secret_2: ${{ secrets.ARKIRA_PRODUCT_SECRET_2 }}
      product_secret_3: ${{ secrets.ARKIRA_PRODUCT_SECRET_3 }}
      product_secret_4: ${{ secrets.ARKIRA_PRODUCT_SECRET_4 }}
  validate:
    name: validate
    needs: [central-validate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: jeanchastel/arkira/actions/require-success@stable # approved-channel
        with:
          result: ${{ needs.central-validate.result }}
