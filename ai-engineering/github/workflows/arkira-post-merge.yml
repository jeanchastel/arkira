name: Arkira Post-Merge Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read

concurrency:
  group: arkira-post-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.ARKIRA_POST_MERGE_DELIVERY_ENABLED == 'true'
    name: deliver production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      mode: ${{ steps.delivery.outputs.mode }}
      status: ${{ steps.delivery.outputs.status }}
      reason: ${{ steps.delivery.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Deliver the merged commit
        id: delivery
        continue-on-error: true
        env:
          ARKIRA_MERGED_SHA: ${{ github.sha }}
          ARKIRA_REPOSITORY: ${{ github.repository }}
          ARKIRA_DEPLOYMENT_MODE: ${{ vars.ARKIRA_DEPLOYMENT_MODE || 'repository-script' }}
          ARKIRA_PROVIDER_STATUS_CONTEXT: ${{ vars.ARKIRA_PROVIDER_STATUS_CONTEXT }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/run-post-merge-delivery.sh
      - name: Fail unsuccessful delivery
        if: steps.delivery.outcome == 'failure'
        run: exit 1

  callback:
    name: notify post-merge delivery
    needs: deploy
    if: ${{ always() && vars.ARKIRA_POST_MERGE_DELIVERY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Send signed delivery callback
        env:
          POST_MERGE_WEBHOOK_URL: ${{ secrets.POST_MERGE_WEBHOOK_URL }}
          POST_MERGE_WEBHOOK_SECRET: ${{ secrets.POST_MERGE_WEBHOOK_SECRET }}
          ARKIRA_MERGED_SHA: ${{ github.sha }}
          ARKIRA_REPOSITORY: ${{ github.repository }}
          ARKIRA_REF: ${{ github.ref }}
          ARKIRA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARKIRA_RUN_ATTEMPT: ${{ github.run_attempt }}
          ARKIRA_DELIVERY_STATUS: ${{ needs.deploy.outputs.status || 'failed' }}
        run: scripts/send-post-merge-callback.sh
