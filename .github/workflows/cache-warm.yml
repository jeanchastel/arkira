name: Arkira cache warmer
on:
  workflow_call:

permissions:
  contents: read

jobs:
  warm:
    name: warm
    runs-on: ubuntu-latest
    steps:
      - name: Configure runner caches
        id: caches
        env:
          PLAYWRIGHT_BROWSERS_PATH_OVERRIDE: ${{ vars.PLAYWRIGHT_BROWSERS_PATH }}
          BASH_ENV: ""
        run: |
          set -euo pipefail
          playwright_path="${PLAYWRIGHT_BROWSERS_PATH_OVERRIDE:-$RUNNER_TOOL_CACHE/arkira-playwright}"
          [[ "$playwright_path" != *$'\n'* && "$playwright_path" != *$'\r'* ]]
          {
            echo "npm_config_cache=$RUNNER_TOOL_CACHE/arkira-dependencies/npm"
            echo "pnpm_config_store_dir=$RUNNER_TOOL_CACHE/arkira-dependencies/pnpm"
            echo "YARN_CACHE_FOLDER=$RUNNER_TOOL_CACHE/arkira-dependencies/yarn"
            echo "COREPACK_HOME=$RUNNER_TOOL_CACHE/arkira-dependencies/corepack"
            echo "PLAYWRIGHT_BROWSERS_PATH=$playwright_path"
          } >> "$GITHUB_ENV"
          echo "playwright_path=$playwright_path" >> "$GITHUB_OUTPUT"
      - name: Check out the executing harness release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Verify the public release
        id: harness
        env:
          HARNESS_REPOSITORY: ${{ job.workflow_repository }}
          HARNESS_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
        run: |
          set -euo pipefail
          [ "$HARNESS_REPOSITORY" = jeanchastel/arkira ]
          root="$(realpath "$GITHUB_WORKSPACE/harness")"
          [ "$(git -C "$root" rev-parse HEAD)" = "$HARNESS_SHA" ]
          node "$root/ai-engineering/distribution/public-release.mjs" verify "$root" >/dev/null
          echo "root=$root" >> "$GITHUB_OUTPUT"
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: product
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the active trusted CI contract
        id: contract
        working-directory: product
        env:
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          TRUSTED_SHA: ${{ github.sha }}
          BASH_ENV: ""
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD^{commit})" = "$TRUSTED_SHA" ]
          tree="$(git rev-parse HEAD^{tree})"
          result="$(node "$ARKIRA_HARNESS_ROOT/ai-engineering/distribution/product-ci-contract.mjs" resolve \
            --repo . --base "$TRUSTED_SHA" --tree "$tree")"
          mode="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).mode)' "$result")"
          if [ "$mode" = legacy ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Cache warming skipped: trusted split CI contract is not active." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$mode" = split ]
          echo "active=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.contract.outputs.active == 'true'
        with:
          node-version: "24"
      - name: Populate package download caches from trusted main
        if: steps.contract.outputs.active == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.tool_cache }}/arkira-dependencies/npm
            ${{ runner.tool_cache }}/arkira-dependencies/pnpm
            ${{ runner.tool_cache }}/arkira-dependencies/yarn
            ${{ runner.tool_cache }}/arkira-dependencies/corepack
          key: arkira-dependencies-${{ runner.os }}-${{ runner.arch }}-node-24-${{ hashFiles('product/package.json', 'product/package-lock.json', 'product/npm-shrinkwrap.json', 'product/pnpm-lock.yaml', 'product/yarn.lock') }}
          restore-keys: arkira-dependencies-${{ runner.os }}-${{ runner.arch }}-node-24-
      - name: Install immutable dependencies from trusted main
        if: steps.contract.outputs.active == 'true'
        working-directory: product
        env:
          ARKIRA_TRUSTED_BASE_SHA: ${{ github.sha }}
        run: |
          bash "${{ steps.harness.outputs.root }}/ai-engineering/scripts/install-product-dependencies.sh" --activate-package-manager
          bash "${{ steps.harness.outputs.root }}/ai-engineering/scripts/install-product-dependencies.sh"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Populate Playwright Chromium cache from trusted main
        if: steps.contract.outputs.active == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.caches.outputs.playwright_path }}
          key: arkira-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('product/package.json', 'product/package-lock.json', 'product/npm-shrinkwrap.json', 'product/pnpm-lock.yaml', 'product/yarn.lock') }}
      - name: Install Playwright Chromium and required Linux packages
        if: steps.contract.outputs.active == 'true'
        working-directory: product
        run: bash "${{ steps.harness.outputs.root }}/ai-engineering/scripts/install-playwright-browsers.sh" chromium
      - name: Populate the pinned Supabase CLI cache from trusted main
        if: steps.contract.outputs.active == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.tool_cache }}/arkira-supabase/2.109.1
          key: arkira-supabase-${{ runner.os }}-${{ runner.arch }}-2.109.1
      - name: Install the pinned Supabase CLI when absent
        if: steps.contract.outputs.active == 'true'
        run: bash "${{ steps.harness.outputs.root }}/ai-engineering/scripts/install-supabase-cli.sh" --prefix "${{ runner.tool_cache }}/arkira-supabase/2.109.1"
