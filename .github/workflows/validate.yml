name: Arkira validation
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      # GitHub.com job.workflow_* identifies this reusable workflow, not its caller.
      # Official checkout example verified 2026-09-06 (not available on GHES):
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#example-usage-of-job-context-workflow-identity
      - name: Check out the executing harness release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Verify the public release
        id: harness
        env:
          HARNESS_REPOSITORY: ${{ job.workflow_repository }}
          HARNESS_SHA: ${{ job.workflow_sha }}
          BASH_ENV: ""
        run: |
          set -euo pipefail
          [ "$HARNESS_REPOSITORY" = jeanchastel/arkira ]
          root="$(realpath "$GITHUB_WORKSPACE/harness")"
          [ "$(git -C "$root" rev-parse HEAD)" = "$HARNESS_SHA" ]
          node "$root/ai-engineering/distribution/public-release.mjs" verify "$root" >/dev/null
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Harness release commit: $HARNESS_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted base and classify
        id: shape
        working-directory: product
        env:
          TRUSTED_BASE: ${{ github.event.pull_request.base.sha }}
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          ARKIRA_HARNESS_SHA: ${{ job.workflow_sha }}
          ARKIRA_HARNESS_VERIFIED: "true"
          BASH_ENV: ""
        run: |
          set -euo pipefail
          [[ "$TRUSTED_BASE" =~ ^[a-f0-9]{40}$ ]]
          [ "$(git rev-parse "$TRUSTED_BASE^{commit}")" = "$TRUSTED_BASE" ]
          git merge-base --is-ancestor "$TRUSTED_BASE" HEAD
          tree="$(git rev-parse HEAD^{tree})"
          result="$(bash "$ARKIRA_HARNESS_ROOT/ai-engineering/scripts/run-documentation-gate.sh" classify --repo . --base "$TRUSTED_BASE" --tree "$tree")"
          if [ "$result" = VALIDATION_SHAPE=report-only ]; then
            shape=report-only
          else
            [ "$result" = VALIDATION_SHAPE=complete ]
            result="$(bash "$ARKIRA_HARNESS_ROOT/ai-engineering/bootstrap/classify-validation-shape.sh" --repo . --base "$TRUSTED_BASE" --tree "$tree")"
            shape="$(awk -F= '$1 == "VALIDATION_SHAPE" {print $2}' <<< "$result")"
          fi
          case "$shape" in report-only|type-only|behavioral) ;; *) exit 1 ;; esac
          echo "shape=$shape" >> "$GITHUB_OUTPUT"
          {
            echo "base=$TRUSTED_BASE"
            echo "tree=$tree"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Validation shape: $shape"
            echo "Trusted base: $TRUSTED_BASE"
            echo "Candidate tree: $tree"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate documentation
        if: steps.shape.outputs.shape == 'report-only'
        working-directory: product
        env:
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          ARKIRA_HARNESS_SHA: ${{ job.workflow_sha }}
          ARKIRA_HARNESS_VERIFIED: "true"
          ARKIRA_TRUSTED_BASE_SHA: ${{ steps.shape.outputs.base }}
          ARKIRA_CANDIDATE_TREE: ${{ steps.shape.outputs.tree }}
          BASH_ENV: ""
        run: |
          bash "$ARKIRA_HARNESS_ROOT/ai-engineering/scripts/run-documentation-gate.sh" validate --repo . --base "$ARKIRA_TRUSTED_BASE_SHA" --tree "$ARKIRA_CANDIDATE_TREE"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.shape.outputs.shape != 'report-only'
        with:
          node-version: "24"
      - name: Activate the declared package manager
        if: steps.shape.outputs.shape != 'report-only'
        working-directory: product
        env:
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          ARKIRA_HARNESS_SHA: ${{ job.workflow_sha }}
          ARKIRA_HARNESS_VERIFIED: "true"
          BASH_ENV: ""
        run: bash "$ARKIRA_HARNESS_ROOT/ai-engineering/scripts/install-product-dependencies.sh" --activate-package-manager
      - name: Install immutable dependencies
        if: steps.shape.outputs.shape != 'report-only'
        working-directory: product
        env:
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          ARKIRA_HARNESS_SHA: ${{ job.workflow_sha }}
          ARKIRA_HARNESS_VERIFIED: "true"
          BASH_ENV: ""
        run: |
          bash "$ARKIRA_HARNESS_ROOT/ai-engineering/scripts/install-product-dependencies.sh"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Run type-only checks
        if: steps.shape.outputs.shape == 'type-only'
        working-directory: product
        env:
          ARKIRA_FOCUSED_TEST_COMMAND: ${{ vars.ARKIRA_FOCUSED_TEST_COMMAND }}
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          ARKIRA_HARNESS_SHA: ${{ job.workflow_sha }}
          ARKIRA_HARNESS_VERIFIED: "true"
          BASH_ENV: ""
        run: bash "$ARKIRA_HARNESS_ROOT/ai-engineering/scripts/run-type-only-checks.sh"
      - name: Run product release inventory
        if: steps.shape.outputs.shape == 'behavioral'
        working-directory: product
        env:
          ARKIRA_HARNESS_ROOT: ${{ steps.harness.outputs.root }}
          ARKIRA_HARNESS_SHA: ${{ job.workflow_sha }}
          ARKIRA_HARNESS_VERIFIED: "true"
          BASH_ENV: ""
        run: bash "$ARKIRA_HARNESS_ROOT/scripts/run-all-tests.sh" --mode release --central-product
